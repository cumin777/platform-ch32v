; 11-led-test: User LED 1Hz blink (F&P 10) + WS2812 RGB color cycle (F&P 12)
; Mirrored from awesome-se/xiao-testplan/xiao-ch32x035-test-plan (11-led-test/);
; implementation spec: docs/sample-specs/11-led-test-spec.md in that repo.
; Self-contained: BSP aliases in src/xiao_ch32x035.h, board json in boards/.

[env:seeed_xiao_ch32x035]
platform = https://github.com/cumin777/platform-ch32v.git
framework = arduino
board = seeed_xiao_ch32x035
monitor_speed = 115200

; --- Flash path 1 (default): WCH-LinkE over the 2-wire SDI debug port ---
; Wiring: LinkE SWDIO -> TP6 (PC18), SWCLK -> TP5 (PC19), GND -> TP8
upload_protocol = wch-link

; --- Flash path 2: on-chip ROM USB ISP, no probe needed ---
; Hold K2 (BOOT) while plugging USB, then:
;   pio run -t upload -e seeed_xiao_ch32x035_isp
[env:seeed_xiao_ch32x035_isp]
extends = env:seeed_xiao_ch32x035
upload_protocol = isp

; --- Flash path 3: UF2 drag-drop onto the TinyUF2 XIAO035BOOT drive ---
; Relinks the app above the 16K bootloader region (base 0x4000), then pack:
;   pio run -e seeed_xiao_ch32x035_uf2
;   python ..\..\tools\mkuf2.py .pio\build\seeed_xiao_ch32x035_uf2\firmware.bin
[env:seeed_xiao_ch32x035_uf2]
extends = env:seeed_xiao_ch32x035
board_build.ldscript = ../ch32x035_uf2.ld
